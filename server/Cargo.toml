[package]
name = "realtime-server"
version = "0.2.4"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
openidconnect = "4"
rand = "0.8"
nanoid = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
y-sweet-core = "0.9"
yrs = "0.19"
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "1"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
hmac = "0.12"
base64 = "0.22"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
ssh-key = { version = "0.6.7", features = ["ed25519"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
